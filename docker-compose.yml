services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB__USER:-supportbot}
      POSTGRES_PASSWORD: ${DB__PASSWORD:-supportbot}
      POSTGRES_DB: ${DB__NAME:-supportbot}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER:-supportbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB__HOST: db
      DB__PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
